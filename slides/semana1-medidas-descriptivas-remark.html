# Medidas de Tendencia Central

## ¿Dónde está el "centro" de nuestros datos?

---

# Escenario: Satisfacción de una ONG

Calificaciones de **7 usuarios** (escala 1-10):

.math-display[
8, 9, 8, 7, 9, 10, 2
]

--

## 🤔 Pregunta Clave

Si un donador pregunta:

**"¿Qué tan satisfechos están los usuarios?"**

### ¿Qué número le damos?

---

# Tres Respuestas Posibles

.three-col[
.highlight-box[
### MEDIA
**7.6** puntos

.small-text[Suma todo / Cantidad]
]

.highlight-box[
### MEDIANA
**8** puntos

.small-text[Valor del medio]
]

.highlight-box[
### MODA
**8** puntos

.small-text[Más frecuente]
]
]

---

# 📐 La Media (Promedio)

## ¿Qué es?

El **"punto de balance"** de los datos

--

**Fórmula:**

.math-display[
μ = (Σ datos) / n
]

--

**En nuestro ejemplo:**

.math-display[
(8+9+8+7+9+10+2) / 7 = 7.6
]

---

# La Media: Analogía del Balancín

**Imagina un balancín:**

- Cada dato es un peso
- La media es el punto donde se equilibra
- Si quitas un peso pesado, el balancín se inclina

--

.alert-warning[
### ⚠️ Problema

La media es **sensible a valores extremos**

En nuestro caso: el **2** jala la media hacia abajo
]

---

# 📊 La Mediana (Valor Central)

## ¿Qué es?

El valor que **divide los datos a la mitad**

--

**Procedimiento:**

1. Ordenar datos de menor a mayor
2. Tomar el valor del medio

--

**En nuestro ejemplo:**

.math-display[
2, 7, 8, **8**, 9, 9, 10
]

Mediana = **8**

---

# La Mediana: Analogía

Imagina 7 personas ordenadas por altura:

```
👤 👤 👤 🧑‍🦱 👤 👤 👤
↓   ↓   ↓   ↓   ↓   ↓   ↓
1.50 1.60 1.65 1.70 1.75 1.80 1.85
            ⬆️
          MEDIANA
```

--

**La persona del medio** tiene altura mediana

Ni siquiera importa si la más alta mide 1.85 o 2.50m

--

.alert-success[
✅ **Ventaja:** NO le afectan los valores extremos
]

---

# 🎯 La Moda (Valor Más Común)

## ¿Qué es?

El valor que **aparece con mayor frecuencia**

--

**En nuestro ejemplo:**

.math-display[
2(1×), 7(1×), **8(2×)**, 9(2×), 10(1×)
]

--

Tenemos **dos modas**: 8 y 9 → **Bimodal**

---

# La Moda: Analogía

Si preguntamos: **"¿Qué calificación es más popular?"**

La respuesta es la **moda**

--

Como en una votación: El candidato que más votos tiene

--

.alert-info[
### 💡 Uso típico

Variables categóricas

**Ejemplo:** "¿Qué servicio prefieren?"
- Legal
- Trámites
- Salud
]

---

# ¿Cuándo usar cada una?

.three-col[
.highlight-box[
### 📐 MEDIA

✅ Datos simétricos

✅ Sin outliers

✅ Distribución normal

**Ej:** Edades
]

.highlight-box[
### 📊 MEDIANA

✅ Datos con outliers

✅ Asimétricos

✅ Valor "típico"

**Ej:** Salarios
]

.highlight-box[
### 🎯 MODA

✅ Categóricos

✅ Lo más popular

✅ Multimodal

**Ej:** Preferencias
]
]

# Medidas de Dispersión

## ¿Qué tan dispersos están los datos?

---

# 📏 El Rango

## ¿Qué es?

Diferencia entre el valor más alto y el más bajo

.math-display[
Rango = Máximo - Mínimo
]

---

# El Rango: Ejemplo

.two-col[
<div>

### ONG A

- Máximo: 8
- Mínimo: 8
- **Rango:** 0

</div>

<div>

### ONG B

- Máximo: 15
- Mínimo: 1
- **Rango:** 14

</div>
]

--

.alert-warning[
### ⚠️ Limitación

Solo usa **2 datos** (max y min)

Ignora todo lo demás
]

---

# 📊 Desviación Estándar

## La medida más importante

**Qué tan "dispersos" están los datos respecto al promedio**

--

- **DE baja:** Datos concentrados cerca de la media
- **DE alta:** Datos dispersos, alejados de la media

---

# Desviación Estándar: Comparación

.two-col[
.highlight-box[
### ONG A

- Media: 8.0
- Todos = 8
- **DE:** 0

.small-text[Sin variabilidad]
]

.highlight-box[
### ONG B

- Media: 8.0
- Datos: 1 a 15
- **DE:** ~4.5

.small-text[Muy variable]
]
]

---

# Analogía: Tiros al Blanco

.two-col[
<div>

### Jugador A (DE baja)

```
    🎯
  🔴🔴🔴
  🔴🎯🔴
  🔴🔴🔴
```

Todos cerca del centro

</div>

<div>

### Jugador B (DE alta)

```
🔴      🔴
    🎯
🔴      🔴
```

Tiros dispersos

</div>
]

--

.alert-success[
✅ **DE baja** = Consistencia

✅ **DE alta** = Variabilidad
]

---

# ¿Cómo se Calcula la DE?

## Paso a Paso

1. Calcula la media

2. Resta la media a cada dato

3. Eleva al cuadrado cada diferencia

4. Promedia esos cuadrados

5. Saca raíz cuadrada

---

# Fórmula de la Desviación Estándar

.math-display[
DE = √[Σ(x - μ)² / n]
]

**Donde:**
- x = cada dato
- μ = media
- n = cantidad de datos

---

# Ejemplo Numérico: Parte 1

Datos: **8, 9, 10**

Media = 9

--

### Paso 1: Diferencias

- 8 - 9 = **-1**
- 9 - 9 = **0**
- 10 - 9 = **1**

---

# Ejemplo Numérico: Parte 2

### Paso 2: Cuadrados

- (-1)² = **1**
- (0)² = **0**
- (1)² = **1**

--

### Paso 3: Promedio

(1 + 0 + 1) / 3 = **0.67**

---

# Ejemplo Numérico: Resultado

### Paso 4: Raíz

√0.67 = **0.82**

--

.math-display[
DE = 0.82 puntos
]

---

# Interpretando la Desviación Estándar

## Regla Empírica (Distribución Normal)

- **~68%** de datos a **±1 DE** de la media

- **~95%** de datos a **±2 DE** de la media

- **~99.7%** de datos a **±3 DE** de la media

---

# Ejemplo: Tiempo de Espera

**Media:** 20 minutos

**DE:** 5 minutos

--

**68%** de usuarios espera entre:
- 15 min (20-5) y 25 min (20+5)

--

**95%** de usuarios espera entre:
- 10 min (20-10) y 30 min (20+10)

---

# ¿Qué significa esto?

.two-col[
.alert-success[
### DE pequeña (2 min)

- Servicio **predecible**
- Tiempo similar
- ✅ **Bueno**
]

.alert-warning[
### DE grande (15 min)

- Servicio **inconsistente**
- Tiempos muy variables
- ⚠️ **Problema**
]
]

---

# 📐 Coeficiente de Variación (CV)

## ¿Por qué lo necesitamos?

No podemos comparar DE directamente si las escalas son diferentes

--

**Ejemplo:**

- **Variable A:** Satisfacción (1-10), DE = 2
- **Variable B:** Tiempo (minutos), DE = 15

¿Cuál es más variable?

---

# Solución: Coeficiente de Variación

.math-display[
CV = (DE / Media) × 100%
]

Expresa la DE como **porcentaje de la media**

---

# CV: Aplicación

.two-col[
<div>

### Variable A

**Satisfacción**

- Media: 8
- DE: 2
- **CV:** (2/8) × 100

.math-display[
= 25%
]

</div>

<div>

### Variable B

**Tiempo Espera**

- Media: 30 min
- DE: 15 min
- **CV:** (15/30) × 100

.math-display[
= 50%
]

</div>
]

---

# CV: Interpretación

.alert-success[
### ✅ Conclusión

Tiempo de espera es **MÁS variable** (50% vs 25%)

Aunque DE es mayor (15 vs 2), el CV nos permite comparar variables en diferentes escalas
]

---

# Resumen: Medidas Descriptivas

.two-col[
.highlight-box[
## Tendencia Central

🎯 **¿Dónde está el centro?**

- **Media:** Balance
- **Mediana:** Valor del medio
- **Moda:** Más frecuente
]

.highlight-box[
## Dispersión

📊 **¿Qué tan dispersos?**

- **Rango:** Max - Min
- **DE:** Dispersión promedio
- **CV:** DE relativa
]
]

---

# Regla de Oro

.alert-warning[
### ⚠️ Nunca reportes solo la media

**SIEMPRE** incluye una medida de dispersión

Media sin DE = información incompleta
]

---
